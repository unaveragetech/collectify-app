name: Build iOS

# Builds the unsigned Collectify .ipa for a release that already exists (created with the Android APK).
# Run it from the Actions tab, or:  gh workflow run ios.yml -f version=0.21.0 -f build=34 -f catalog=11
#
# Two jobs run side by side:
#   ipa        tests the Swift core against the real catalog, builds the app and attaches
#              Collectify-v<version>.ipa (+ .sha256) to the release (a few minutes)
#   simulator  boots the app in the iOS Simulator and drives it (slow, and never blocks the .ipa);
#              its screenshots and results are uploaded as the "simulator-smoke" artifact
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, e.g. 0.21.0 (the release tag is v<version>-standalone)"
        required: true
      build:
        description: "Build number: same as the Android versionCode, e.g. 34"
        required: true
      catalog:
        description: "Catalog version (read from the release catalog-v<N>), e.g. 11"
        required: true
      tag:
        description: "Release to read ios-www.zip from and attach the .ipa to (default: v<version>-standalone)"
        required: false
        default: ""
      smoke:
        description: "Also run the (slow) simulator smoke test"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  VERSION: ${{ inputs.version }}
  BUILD: ${{ inputs.build }}
  CATALOG: ${{ inputs.catalog }}
  TAG: ${{ inputs.tag != '' && inputs.tag || format('v{0}-standalone', inputs.version) }}

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the web UI and card catalog
        run: |
          set -euo pipefail
          mkdir -p ios/Resources
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p ios-www.zip -D "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/ios-www.zip" -d ios/Resources
          test -f ios/Resources/www/index.html
          gh release download "catalog-v${CATALOG}" -R "$GITHUB_REPOSITORY" -p collectify.db.gz -D "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/collectify.db.gz" > ios/Resources/collectify.db
          echo "$CATALOG" > ios/Resources/catalog_version.txt

      - name: Test the Swift core (against the real catalog)
        working-directory: ios/CollectifyCore
        env:
          COLLECTIFY_CATALOG_DB: ${{ github.workspace }}/ios/Resources/collectify.db
        run: |
          set -o pipefail
          swift test 2>&1 | tail -150

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Collectify.xcodeproj -scheme Collectify -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -60

      - name: Package the .ipa
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/Collectify.app"
          test -d "$APP"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Collectify-v${VERSION}.ipa" Payload)
          shasum -a 256 "Collectify-v${VERSION}.ipa" | tee "Collectify-v${VERSION}.ipa.sha256"
          ls -la "Collectify-v${VERSION}.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Attach to the release
        run: |
          gh release upload "$TAG" "Collectify-v${VERSION}.ipa" "Collectify-v${VERSION}.ipa.sha256" -R "$GITHUB_REPOSITORY" --clobber

  simulator:
    if: ${{ inputs.smoke }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the web UI and card catalog
        run: |
          set -euo pipefail
          mkdir -p ios/Resources
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p ios-www.zip -D "$RUNNER_TEMP"
          unzip -q -o "$RUNNER_TEMP/ios-www.zip" -d ios/Resources
          gh release download "catalog-v${CATALOG}" -R "$GITHUB_REPOSITORY" -p collectify.db.gz -D "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/collectify.db.gz" > ios/Resources/collectify.db
          echo "$CATALOG" > ios/Resources/catalog_version.txt

      - name: Smoke test in the iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/smoke"
          brew install xcodegen && xcodegen generate
          xcodebuild build \
            -project Collectify.xcodeproj -scheme Collectify -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO > "$GITHUB_WORKSPACE/smoke/build.log" 2>&1 || { grep -E "error:" "$GITHUB_WORKSPACE/smoke/build.log" | sort -u | head -20; exit 1; }
          APP="build-sim/Build/Products/Debug-iphonesimulator/Collectify.app"
          xcrun simctl list devices available > "$GITHUB_WORKSPACE/smoke/devices.txt"
          UDID=$(grep -m1 -E "iPhone (1[5-9]|Air)" "$GITHUB_WORKSPACE/smoke/devices.txt" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP"
          sleep 20
          for i in 1 2 3 4 5 6 7 8; do
            xcrun simctl launch "$UDID" com.collectify.app && break
            sleep 15
          done
          DATA=$(xcrun simctl get_app_container "$UDID" com.collectify.app data)
          for i in $(seq 1 300); do
            code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:8321/api/binders || true)
            [ "$code" = "200" ] && break
            if [ $((i % 20)) -eq 0 ]; then
              echo "waiting ($i): http $code"; xcrun simctl spawn "$UDID" launchctl list | grep -i collectify || echo "app process not running"
              ls -la "$DATA/Library/Application Support" 2>&1 | tail -4
            fi
            sleep 3
          done
          echo "binders: $code"
          [ "$code" = "200" ] || { xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "Collectify"' --style compact 2>/dev/null | tail -60 > "$GITHUB_WORKSPACE/smoke/log.txt"; exit 1; }
          curl -s -m 20 http://127.0.0.1:8321/api/binders | tee "$GITHUB_WORKSPACE/smoke/binders.json"; echo
          curl -s -m 30 "http://127.0.0.1:8321/api/search?q=pikachu&limit=2" | head -c 700 | tee "$GITHUB_WORKSPACE/smoke/search.json"; echo
          curl -s -m 20 -o /dev/null -w "index %{http_code} %{size_download} bytes\n" http://127.0.0.1:8321/ | tee "$GITHUB_WORKSPACE/smoke/index.txt"
          curl -s -m 20 -o /dev/null -w "island_world.js %{http_code}\n" http://127.0.0.1:8321/static/island_world.js | tee -a "$GITHUB_WORKSPACE/smoke/index.txt"
          js() { curl -s -m 70 -X POST --data-binary "$1" http://127.0.0.1:8321/__debug/js; echo; }
          shot() { xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/smoke/$1.png"; }
          for i in $(seq 1 20); do
            r=$(js "return document.readyState")
            echo "$r" | grep -q complete && break
            sleep 3
          done
          js "return {secure: isSecureContext, native: typeof CollectifyNative, info: CollectifyNative.info(), notify: CollectifyNative.canNotify(), getUserMedia: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), ua: navigator.userAgent, cores: navigator.hardwareConcurrency}" | tee "$GITHUB_WORKSPACE/smoke/env.json"
          js "window.__errs = []; addEventListener('error', function (e) { __errs.push(String(e.message)); }); addEventListener('unhandledrejection', function (e) { __errs.push('rejection: ' + String(e.reason)); }); const b = document.querySelector('#disclaimer-accept'); if (b) b.click(); return !!b" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
          sleep 4
          shot 01-scan
          for t in binders trade game island wishlist browse; do
            js "document.querySelector('.tab[data-screen=\"$t\"]').click(); return '$t'" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
            sleep 6
            shot "02-$t"
          done
          js "const c = document.createElement('canvas'); const gl = c.getContext('webgl2') || c.getContext('webgl'); return {webgl: !!gl, renderer: gl ? gl.getParameter(gl.VERSION) : null}" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
          js "const b = document.querySelector('[data-isl=\"adopt0\"]'); if (b) b.click(); return !!b" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
          sleep 15
          shot 03-island-started
          js "return {errors: window.__errs, view: typeof islView !== 'undefined' && !!islView, stage: typeof islView !== 'undefined' && islView ? islView.stage() : null}" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
          js "const r = await fetch('/api/collection', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({product_id: 524060})}); const j = await r.json(); const p = await (await fetch('/api/binders/default/page')).json(); return {status: r.status, add: j, first: p.slots[0] && p.slots[0].name}" | tee -a "$GITHUB_WORKSPACE/smoke/env.json"
          js "document.querySelector('.tab[data-screen=\"binders\"]').click(); return 1" > /dev/null
          sleep 5
          shot 04-binders-with-card
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Collectify"' --style compact 2>/dev/null | tail -60 > "$GITHUB_WORKSPACE/smoke/log.txt" || true

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: smoke/
          if-no-files-found: ignore
